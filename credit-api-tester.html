<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit System API Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .response {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .response.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .response.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #2e7d32;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .balance-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-display h3 {
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .balance-display .amount {
            font-size: 3em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💳 Credit System API Tester</h1>

        <div class="balance-display">
            <h3>Current Balance</h3>
            <div class="amount" id="balanceDisplay">--.--</div>
            <small>MYR</small>
        </div>

        <div class="grid">
            <!-- Get Balance -->
            <div class="card">
                <h2>📊 Get Balance</h2>
                <div class="form-group">
                    <label>User ID:</label>
                    <input type="number" id="balanceUserId" value="1">
                </div>
                <button onclick="getBalance()">Get Balance</button>
                <div id="balanceResponse" class="response" style="display:none;"></div>
            </div>

            <!-- Mock Payment -->
            <div class="card">
                <h2>💰 Mock Payment Gateway</h2>
                <div class="form-group">
                    <label>Amount (MYR):</label>
                    <input type="number" id="paymentAmount" value="100" step="0.01">
                </div>
                <div class="form-group">
                    <label>Payment Method:</label>
                    <select id="paymentMethod">
                        <option value="MOCK">Mock</option>
                        <option value="STRIPE">Stripe</option>
                        <option value="PAYPAL">PayPal</option>
                    </select>
                </div>
                <button onclick="mockPayment()">Process Payment</button>
                <div id="paymentResponse" class="response" style="display:none;"></div>
            </div>

            <!-- Purchase Credits -->
            <div class="card">
                <h2>🛒 Purchase Credits</h2>
                <div class="form-group">
                    <label>User ID:</label>
                    <input type="number" id="purchaseUserId" value="1">
                </div>
                <div class="form-group">
                    <label>Amount:</label>
                    <input type="number" id="purchaseAmount" value="100" step="0.01">
                </div>
                <div class="form-group">
                    <label>Discount Code (optional):</label>
                    <input type="text" id="purchaseDiscountCode" placeholder="e.g., WELCOME2025">
                </div>
                <button onclick="purchaseCredits()">Purchase Credits</button>
                <div id="purchaseResponse" class="response" style="display:none;"></div>
            </div>

            <!-- Deduct Credits -->
            <div class="card">
                <h2>➖ Deduct Credits</h2>
                <div class="form-group">
                    <label>User ID:</label>
                    <input type="number" id="deductUserId" value="1">
                </div>
                <div class="form-group">
                    <label>Amount:</label>
                    <input type="number" id="deductAmount" value="10" step="0.01">
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <input type="text" id="deductDescription" value="LE1 Form Generation">
                </div>
                <button onclick="deductCredits()">Deduct Credits</button>
                <div id="deductResponse" class="response" style="display:none;"></div>
            </div>

            <!-- Validate Discount Code -->
            <div class="card">
                <h2>🎟️ Validate Discount Code</h2>
                <div class="form-group">
                    <label>Discount Code:</label>
                    <input type="text" id="validateCode" placeholder="e.g., SAVE10">
                </div>
                <div class="form-group">
                    <label>User ID:</label>
                    <input type="number" id="validateUserId" value="1">
                </div>
                <div class="form-group">
                    <label>Purchase Amount:</label>
                    <input type="number" id="validateAmount" value="100" step="0.01">
                </div>
                <button onclick="validateDiscountCode()">Validate Code</button>
                <div id="validateResponse" class="response" style="display:none;"></div>
            </div>

            <!-- Create Discount Code -->
            <div class="card">
                <h2>➕ Create Discount Code</h2>
                <div class="form-group">
                    <label>Code:</label>
                    <input type="text" id="createCode" placeholder="e.g., WELCOME2025">
                </div>
                <div class="form-group">
                    <label>Type:</label>
                    <select id="createType">
                        <option value="PERCENTAGE">Percentage</option>
                        <option value="FIXED_AMOUNT">Fixed Amount</option>
                        <option value="BONUS_CREDITS">Bonus Credits</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Value:</label>
                    <input type="number" id="createValue" value="10" step="0.01">
                </div>
                <div class="form-group">
                    <label>Usage Limit:</label>
                    <input type="number" id="createLimit" value="100">
                </div>
                <button onclick="createDiscountCode()">Create Code</button>
                <div id="createResponse" class="response" style="display:none;"></div>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="card">
            <h2>📜 Transaction History</h2>
            <div class="form-group">
                <label>User ID:</label>
                <input type="number" id="historyUserId" value="1">
            </div>
            <button onclick="getTransactionHistory()">Get History</button>
            <div id="historyResponse" class="response" style="display:none;"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5001/fusioneta-test/us-central1/altomateLE';

        function showResponse(elementId, data, isError = false) {
            const el = document.getElementById(elementId);
            el.style.display = 'block';
            el.className = 'response ' + (isError ? 'error' : 'success');
            el.textContent = JSON.stringify(data, null, 2);
        }

        async function getBalance() {
            const userId = document.getElementById('balanceUserId').value;
            try {
                const response = await fetch(`${API_BASE}/api/credits/balance/${userId}`);
                const data = await response.json();
                showResponse('balanceResponse', data, !response.ok);
                if (response.ok) {
                    document.getElementById('balanceDisplay').textContent = data.balance;
                }
            } catch (error) {
                showResponse('balanceResponse', { error: error.message }, true);
            }
        }

        async function mockPayment() {
            const amount = document.getElementById('paymentAmount').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            try {
                const response = await fetch(`${API_BASE}/api/payment/mock-process`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: parseFloat(amount), paymentMethod })
                });
                const data = await response.json();
                showResponse('paymentResponse', data, !response.ok);
            } catch (error) {
                showResponse('paymentResponse', { error: error.message }, true);
            }
        }

        async function purchaseCredits() {
            const userId = document.getElementById('purchaseUserId').value;
            const amount = document.getElementById('purchaseAmount').value;
            const discountCode = document.getElementById('purchaseDiscountCode').value;

            // First, process mock payment
            try {
                const paymentResponse = await fetch(`${API_BASE}/api/payment/mock-process`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: parseFloat(amount), paymentMethod: 'MOCK' })
                });
                const paymentData = await paymentResponse.json();

                if (!paymentResponse.ok) {
                    showResponse('purchaseResponse', paymentData, true);
                    return;
                }

                // Then purchase credits
                const purchaseResponse = await fetch(`${API_BASE}/api/credits/purchase`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: parseInt(userId),
                        amount: parseFloat(amount),
                        paymentMethod: 'MOCK',
                        paymentTransactionId: paymentData.transactionId,
                        discountCode: discountCode || undefined
                    })
                });
                const purchaseData = await purchaseResponse.json();
                showResponse('purchaseResponse', purchaseData, !purchaseResponse.ok);

                if (purchaseResponse.ok) {
                    getBalance();
                }
            } catch (error) {
                showResponse('purchaseResponse', { error: error.message }, true);
            }
        }

        async function deductCredits() {
            const userId = document.getElementById('deductUserId').value;
            const amount = document.getElementById('deductAmount').value;
            const description = document.getElementById('deductDescription').value;

            try {
                const response = await fetch(`${API_BASE}/api/credits/deduct`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: parseInt(userId),
                        amount: parseFloat(amount),
                        description,
                        referenceType: 'TEST',
                        referenceId: 'TEST-' + Date.now()
                    })
                });
                const data = await response.json();
                showResponse('deductResponse', data, !response.ok);

                if (response.ok) {
                    getBalance();
                }
            } catch (error) {
                showResponse('deductResponse', { error: error.message }, true);
            }
        }

        async function validateDiscountCode() {
            const code = document.getElementById('validateCode').value;
            const userId = document.getElementById('validateUserId').value;
            const amount = document.getElementById('validateAmount').value;

            try {
                const response = await fetch(`${API_BASE}/api/discount-codes/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code,
                        userId: parseInt(userId),
                        purchaseAmount: parseFloat(amount)
                    })
                });
                const data = await response.json();
                showResponse('validateResponse', data, !response.ok);
            } catch (error) {
                showResponse('validateResponse', { error: error.message }, true);
            }
        }

        async function createDiscountCode() {
            const code = document.getElementById('createCode').value;
            const discountType = document.getElementById('createType').value;
            const discountValue = document.getElementById('createValue').value;
            const usageLimit = document.getElementById('createLimit').value;

            try {
                const response = await fetch(`${API_BASE}/api/discount-codes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code,
                        description: 'Test discount code',
                        discountType,
                        discountValue: parseFloat(discountValue),
                        minPurchaseAmount: 0,
                        usageLimit: parseInt(usageLimit),
                        usagePerUser: 1
                    })
                });
                const data = await response.json();
                showResponse('createResponse', data, !response.ok);
            } catch (error) {
                showResponse('createResponse', { error: error.message }, true);
            }
        }

        async function getTransactionHistory() {
            const userId = document.getElementById('historyUserId').value;
            try {
                const response = await fetch(`${API_BASE}/api/credits/transactions/${userId}?limit=20`);
                const data = await response.json();
                showResponse('historyResponse', data, !response.ok);
            } catch (error) {
                showResponse('historyResponse', { error: error.message }, true);
            }
        }

        // Auto-load balance on page load
        window.addEventListener('load', () => {
            getBalance();
        });
    </script>
</body>

</html>
