<div class="discount-container">
    <h1>Discount Dashboard</h1>
    <div class="header-actions">
        <div class="search-bar">
            <input type="text" [(ngModel)]="searchTerm" placeholder="Search by code..." (input)="applyFilter($event)">
        </div>
        <button class="btn btn-primary" (click)="openAddDialog()">+ Add New Discount</button>
    </div>

    <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <ng-container matColumnDef="code">
                <th mat-header-cell *matHeaderCellDef> Code </th>
                <td mat-cell *matCellDef="let element"> {{element.code}} </td>
            </ng-container>

            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef> Type </th>
                <td mat-cell *matCellDef="let element"> {{element.discount_type}} </td>
            </ng-container>

            <ng-container matColumnDef="value">
                <th mat-header-cell *matHeaderCellDef> Value </th>
                <td mat-cell *matCellDef="let element"> {{element.discount_value}} </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let element">
                    <span class="badge" [ngClass]="element.is_active ? 'active' : 'archived'">
                        {{element.is_active ? 'Active' : 'Archived'}}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button (click)="openEditDialog(element)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button (click)="toggleActive(element)">
                        <mat-icon>{{element.is_active ? 'archive' : 'unarchive'}}</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
