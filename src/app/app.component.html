<div class="app-layout">
  <!-- Sidebar (hidden on /login) -->
  <aside class="sidebar" *ngIf="!isLoginPage" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
      <button class="toggle-btn" (click)="toggleSidebar()">
        {{ isCollapsed ? '☰' : '✕' }}
      </button>
      <h2 *ngIf="!isCollapsed">LE Form.ai</h2>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard"><svg xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 0 640 640">

      <a routerLink="/reports"><svg xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 0 640 640">
          <path fill="#ffffff"
            d="M416.9 85.2L372 130.1L509.9 268L554.8 223.1C568.4 209.6 576 191.2 576 172C576 191.2 568.4 209.6 554.8 223.1L519.1 85.2C505.6 71.6 487.2 64 468 64C448.8 64 430.4 71.6 416.9 85.2zM338.1 164L122.9 379.1C112.2 389.8 104.4 403.2 100.3 417.8L64.9 545.6C62.6 553.9 64.9 562.9 71.1 569C77.3 575.1 86.2 577.5 94.5 575.2L222.3 539.7C236.9 535.6 250.2 527.9 261 517.1L476 301.9L338.1 164z" />

      <a routerLink="/settings"><svg xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 0 640 640">
          <path fill="#ffffff"
            d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z" />
        </svg><span *ngIf="!isCollapsed">Settings</span></a>
      <a *ngIf="isAdmin" routerLink="/discount"><svg width="14px" height="14px" viewBox="0 0 15 15" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M6.4479 0.435794L5.31888 1.56481C5.22738 1.65631 5.10328 1.70772 4.97389 1.70772H3.19561C2.37387 1.70772 1.70772 2.37387 1.70772 3.19561V4.97389C1.70772 5.10328 1.65631 5.22738 1.56481 5.31888L0.435794 6.4479C-0.145264 7.02896 -0.145265 7.97104 0.435794 8.5521L1.56481 9.68112C1.65631 9.77262 1.70772 9.89672 1.70772 10.0261V11.8044C1.70772 12.6261 2.37387 13.2923 3.19561 13.2923H4.97389C5.10328 13.2923 5.22738 13.3437 5.31888 13.4352L6.4479 14.5642C7.02896 15.1453 7.97104 15.1453 8.5521 14.5642L9.68112 13.4352C9.77262 13.3437 9.89672 13.2923 10.0261 13.2923H11.8044C12.6261 13.2923 13.2923 12.6261 13.2923 11.8044V10.0261C13.2923 9.89672 13.3437 9.77262 13.4352 9.68112L14.5642 8.5521C15.1453 7.97104 15.1453 7.02896 14.5642 6.4479L13.4352 5.31888C13.3437 5.22738 13.2923 5.10328 13.2923 4.97389V3.19561C13.2923 2.37387 12.6261 1.70772 11.8044 1.70772H10.0261C9.89672 1.70772 9.77262 1.65631 9.68112 1.56481L8.5521 0.435794C7.97104 -0.145264 7.02896 -0.145265 6.4479 0.435794ZM4.64648 9.64645L9.64648 4.64645L10.3536 5.35356L5.35359 10.3536L4.64648 9.64645ZM5 5V6H6V5H5ZM9 10H10V9H9V10Z"
            fill="#ffffff"></path>
        </svg><span *ngIf="!isCollapsed">Discount Code</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="legal-links" *ngIf="!isCollapsed">
        <a routerLink="/terms" class="legal-link">Terms & Conditions</a>
        <a routerLink="/privacy" class="legal-link">Privacy Policy</a>
      </div>
      <div class="support-section">
        <a class="support-link" (click)="openSupport()">
          <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle opacity="0.5" cx="12" cy="12" r="10" stroke="#ededed" stroke-width="1.5"></circle>
            <path
              d="M10.125 8.875C10.125 7.83947 10.9645 7 12 7C13.0355 7 13.875 7.83947 13.875 8.875C13.875 9.56245 13.505 10.1635 12.9534 10.4899C12.478 10.7711 12 11.1977 12 11.75V13"
              stroke="#ededed" stroke-width="1.5" stroke-linecap="round"></path>
            <circle cx="12" cy="16" r="1" fill="#ededed"></circle>
          </svg>
          <span *ngIf="!isCollapsed">Support</span>
        </a>
      </div>
      <div class="user-info">
        <div class="user-details">
          <span class="user-icon">{{ username?.[0] }}</span>
          <span *ngIf="!isCollapsed" class="username-text">{{username}}</span>
        </div>
        <button mat-button *ngIf="!isCollapsed" class="logout-button" (click)="logout()">Logout</button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" [class.expanded]="isCollapsed && !isLoginPage" [class.hide]="isLoginPage">
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

    <footer class="app-footer" *ngIf="!isLoginPage">
      <div class="footer-content">
        <div class="logo-section">
          <img src="assets/Softon Logo.png" alt="Company Logo" class="footer-logo">
          <span class="slogan">Simplifying Your Tax Filling</span>
        </div>
        <div class="company-info">
          <p>Innoda Technology Sdn. Bhd.</p>
          <p>Co Reg No: 202301049093</p>
        </div>
      </div>
    </footer>
  </main>
</div>
